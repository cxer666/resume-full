<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>测试招聘表单</title>
  <style>
    body { margin: 0; padding: 32px; font-family: "Microsoft YaHei", Arial, sans-serif; background:#f6f8fb; color:#172033; }
    main { width:min(820px, 94vw); margin:auto; background:white; border:1px solid #e5e7eb; border-radius:8px; padding:24px; }
    h1 { margin-top:0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:grid; gap:6px; font-size:13px; color:#334155; }
    input, textarea, select { border:1px solid #dbe1ea; border-radius:7px; padding:9px; font:inherit; }
    textarea { min-height:100px; grid-column:1 / -1; }
    .wide { grid-column:1 / -1; }
  </style>
</head>
<body>
  <main>
    <h1>测试招聘表单</h1>
    <p>安装扩展并启动本地服务后，可在此页面测试右下角“填写/检查”。</p>
    <div class="grid">
      <label>姓名 <input name="name" placeholder="请输入姓名"></label>
      <label>手机号码 <input name="mobile" placeholder="请输入手机号"></label>
      <label>邮箱 <input name="email" placeholder="请输入邮箱"></label>
      <label>毕业院校 <input name="school" placeholder="学校"></label>
      <label>专业 <input name="major" placeholder="专业"></label>
      <label>学历 <select name="degree"><option></option><option>本科</option><option>硕士</option><option>大专</option></select></label>
      <label class="wide">项目经历 <textarea name="projects" placeholder="请填写项目经历"></textarea></label>
      <label class="wide">实习经历 <textarea name="internships" placeholder="请填写实习经历"></textarea></label>
      <label class="wide">自我评价 <textarea name="summary" placeholder="请填写自我评价"></textarea></label>
    </div>
  </main>
</body>
</html>
